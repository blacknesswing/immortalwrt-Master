name: Build ImmortalWrt X86

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  REPO_BRANCH: master
  CONFIG_FILE: X86.config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part3.sh
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

    - name: Checkout
      uses: actions/checkout@v4

    - name: 最大化磁盘空间
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 2048
        swap-size-mb: 2048
        remove-dotnet: true
        remove-android: true
        remove-haskell: true
        remove-codeql: true

    - name: 安装编译依赖
      run: |
        sudo apt update
        sudo apt install -y \
        build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
        gettext git libncurses-dev libssl-dev python3-distutils rsync unzip \
        zlib1g-dev file wget curl swig time

        sudo timedatectl set-timezone "$TZ"

    - name: 恢复缓存
      uses: actions/cache@v4
      with:
        path: |
          openwrt/dl
          openwrt/staging_dir
          openwrt/build_dir
          ~/.ccache
        key: immortalwrt-${{ env.REPO_BRANCH }}-${{ hashFiles(env.CONFIG_FILE) }}
        restore-keys: |
          immortalwrt-${{ env.REPO_BRANCH }}

    - name: 克隆源码
      run: |
        git clone $REPO_URL -b $REPO_BRANCH openwrt

    - name: 自定义 feeds
      run: |
        chmod +x $DIY_P1_SH
        cd openwrt
        ../$DIY_P1_SH

    - name: 更新 feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 加载配置
      run: |
        mv $CONFIG_FILE openwrt/.config

        chmod +x $DIY_P2_SH

        cd openwrt
        ../$DIY_P2_SH
        make defconfig

    - name: 下载源码
      run: |
        cd openwrt
        make download -j$(nproc)

        find dl -size -1024c -exec rm -f {} \;

    - name: 编译固件
      run: |
        cd openwrt

        echo "CPU线程: $(nproc)"

        make -j$(nproc) || make -j1 V=s

    - name: 整理并自动重命名固件
      run: |
        cd openwrt/bin/targets/*/* || exit 0

        DATE=$(date +"%Y%m%d")
        BRANCH=${REPO_BRANCH}

        for file in *.img.gz *.img *.qcow2 *.vmdk; do
          [ -e "$file" ] || continue

          EXT=${file##*.}
          NEW="ImmortalWrt_X86_${BRANCH}_${DATE}.${EXT}"

          echo "重命名: $file -> $NEW"

          mv "$file" "$NEW"
        done

        rm -rf packages

        echo "FIRMWARE=$PWD" >> $GITHUB_ENV

    - name: 上传固件
      uses: actions/upload-artifact@v4
      with:
        name: ImmortalWrt_X86_${{ github.run_number }}
        path: ${{ env.FIRMWARE }}

    - name: 删除旧任务
      uses: Mattraks/delete-workflow-runs@v2
      with:
        retain_days: 2
        keep_minimum_runs: 3
